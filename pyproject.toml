[project]
name = "horizon"
version = "0.2.0"
description = "Personal content aggregator — async scraper framework + CLI"
requires-python = ">=3.11"
dependencies = [
    "click",
    "pyyaml",
    "rich",
    "scrapers",
    "openai",
    "python-dotenv",
    "feedparser",
    "beautifulsoup4",
    "python-dateutil",
    "httpx[socks]>=0.28.1",
    "openbb>=4.7.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.40.0",
    "sse-starlette>=3.4.5",
]

[project.scripts]
horizon = "horizon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["scraper-core"]

[tool.uv.sources]
scrapers = { workspace = true }
